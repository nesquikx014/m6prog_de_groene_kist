version: '3.8'

services:
  # Web Server (Nginx + PHP)
  web:
    image: nginx:latest
    container_name: thewall_web
    ports:
      - "8081:80"
    volumes:
      - ./public:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - php
    networks:
      - thewall_network

  # PHP-FPM
  php:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: thewall_php
    volumes:
      - ./public:/var/www/html
      - ./source:/var/www/source
    environment:
      - DB_HOST=mariadb
      - DB_USER=thewall_user
      - DB_PASS=thewall_secure_pass
      - DB_NAME=thewall_db
    depends_on:
      - mariadb
    networks:
      - thewall_network

  # Database (MariaDB)
  mariadb:
    image: mariadb:latest
    container_name: thewall_db
    environment:
      MYSQL_ROOT_PASSWORD: thewall_root_pass
      MYSQL_DATABASE: thewall_db
      MYSQL_USER: thewall_user
      MYSQL_PASSWORD: thewall_secure_pass
    volumes:
      - ./docker/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mariadb_data:/var/lib/mysql
    ports:
      - "3308:3306"
    networks:
      - thewall_network

volumes:
  mariadb_data:

networks:
  thewall_network:
    driver: bridge
