services:
 # PHP FPM Service
  php:
    image: wodby/php:latest
    volumes:
      - './:/var/www/html'
    depends_on:
      - mariadb
# Nginx Service
  nginx:
    image: nginx:latest
    ports:
      - 88:80
    links:
      - 'php'
    volumes:
      - './:/var/www/html'
      - './docker/nginx:/etc/nginx/conf.d'
    depends_on:
      - php

      
  # MariaDB Service
  mariadb:
    image: mariadb:latest
    #image: mysql:latest
    environment:
      MYSQL_DATABASE: m6prog
      MYSQL_USER: m6prog_de_groene_kist
      MYSQL_PASSWORD: On_Melancholy_hill
      MYSQL_ROOT_PASSWORD: On_Melancholy_hill
    ports:
      - 3308:3306
    volumes:
        - ./docker/sql/:/docker-entrypoint-initdb.d


  # php myadmin in an external image
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mariadb
      PMA_USER: m6prog_de_groene_kist
      PMA_PASSWORD: On_Melancholy_hill
    ports:
      - "1088:80"

# Volumes
volumes:
  mysqldata: